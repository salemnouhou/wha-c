<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Settings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:#f0f0f0;display:flex;justify-content:center;padding:40px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif}
.screen{width:390px;background:#f2f2f7;border-radius:40px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.2)}

/* STATUS BAR */
.status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0;background:#f2f2f7}
.status-time{font-size:15px;font-weight:600;color:#000}
.status-icons{display:flex;align-items:center;gap:6px}

/* PAGE CONTENT */
.page{padding:0 0 0;background:#f2f2f7}

/* HEADER */
.page-header{padding:8px 20px 16px;background:#f2f2f7}
.page-title{font-size:34px;font-weight:700;color:#000;letter-spacing:0.3px}

/* SEARCH */
.search-bar{margin:0 16px 20px;background:#e4e4e8;border-radius:12px;display:flex;align-items:center;padding:8px 12px;gap:8px}
.search-bar input{background:transparent;border:none;outline:none;font-size:16px;color:#8e8e93;flex:1;font-family:inherit}
.search-bar svg{flex-shrink:0}

/* SECTIONS */
.section{background:#fff;border-radius:14px;margin:0 16px 20px;overflow:hidden}

/* PROFILE ROW */
.profile-row{display:flex;align-items:center;padding:14px 16px;gap:14px;border-bottom:0.5px solid #e5e5ea}
.profile-avatar{width:62px;height:62px;border-radius:50%;overflow:hidden;flex-shrink:0}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:20px;font-weight:600;color:#000}
.profile-status{font-size:14px;color:#8e8e93;margin-top:2px}
.profile-qr{width:40px;height:40px;border-radius:10px;background:#eef0f8;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* AVATAR ROW */
.avatar-row{display:flex;align-items:center;padding:14px 16px;gap:16px}
.row-icon{width:34px;height:34px;border-radius:8px;background:#eef0f8;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-label{flex:1;font-size:16px;color:#000}
.row-chevron{width:30px;height:30px;border-radius:7px;background:#eef0f8;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* SETTING ROW */
.setting-row{display:flex;align-items:center;padding:13px 16px;gap:16px;border-bottom:0.5px solid #e5e5ea}
.setting-row:last-child{border-bottom:none}
.setting-label{flex:1;font-size:16px;color:#000}

/* TAB BAR */
.tab-bar{background:#f2f2f7;border-top:0.5px solid #c7c7cc;display:flex;padding:0 0 20px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 0;cursor:pointer}
.tab-label{font-size:10px;color:#8e8e93}
.tab-label.active{color:#25D366;font-weight:600}
.tab-icon-active{color:#25D366}
.tab-icon-inactive{color:#8e8e93}
</style>
</head>
<body>
<div class="screen">

  <!-- STATUS BAR -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 17 12" fill="none" width="17" height="12"><rect x="0" y="3" width="3" height="9" fill="#000" rx="0.5"/><rect x="4.5" y="2" width="3" height="10" fill="#000" rx="0.5"/><rect x="9" y="0" width="3" height="12" fill="#000" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" fill="#000" rx="0.5" opacity="0.3"/></svg>
      <svg viewBox="0 0 16 12" fill="none" width="16" height="12"><path d="M8 3.2C10.2 3.2 12.2 4.1 13.6 5.6L15 4.2C13.2 2.3 10.7 1 8 1 5.3 1 2.8 2.3 1 4.2L2.4 5.6C3.8 4.1 5.8 3.2 8 3.2Z" fill="#000"/><path d="M8 6.4C9.4 6.4 10.7 7 11.6 7.9L13 6.5C11.7 5.2 9.9 4.4 8 4.4 6.1 4.4 4.3 5.2 3 6.5L4.4 7.9C5.3 7 6.6 6.4 8 6.4Z" fill="#000"/><circle cx="8" cy="11" r="1.5" fill="#000"/></svg>
      <svg viewBox="0 0 25 12" fill="none" width="25" height="12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="#000" stroke-opacity="0.35"/><rect x="2" y="2" width="18" height="8" rx="2" fill="#000"/><path d="M23 4.5V7.5C23.8 7.2 24.4 6.7 24.4 6 24.4 5.3 23.8 4.8 23 4.5Z" fill="#000" opacity="0.4"/></svg>
    </div>
  </div>

  <!-- PAGE -->
  <div class="page">

    <!-- TITLE -->
    <div class="page-header">
      <span class="page-title">Settings</span>
    </div>

    <!-- SEARCH -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2" width="17" height="17"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="Search" readonly/>
    </div>

    <!-- SECTION 1: Profile + Avatar -->
    <div class="section">
      <!-- Profile -->
      <div class="profile-row">
        <div class="profile-avatar">
          <img src="https://i.pravatar.cc/62?img=33" alt="Marty McFly"/>
        </div>
        <div class="profile-info">
          <div class="profile-name">Marty McFly</div>
          <div class="profile-status">Nobody calls me chicken! 🐔</div>
        </div>
        <div class="profile-qr">
          <!-- QR icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="22" height="22">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="5" y="5" width="3" height="3" fill="#5b6bc0" stroke="none"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/><rect x="16" y="5" width="3" height="3" fill="#5b6bc0" stroke="none"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="5" y="16" width="3" height="3" fill="#5b6bc0" stroke="none"/>
            <line x1="14" y1="14" x2="14" y2="14" stroke-width="3" stroke-linecap="round"/>
            <line x1="18" y1="14" x2="18" y2="14" stroke-width="3" stroke-linecap="round"/>
            <line x1="21" y1="14" x2="21" y2="17" stroke-width="1.8"/>
            <line x1="14" y1="18" x2="17" y2="18" stroke-width="1.8"/>
            <line x1="19" y1="18" x2="21" y2="18" stroke-width="1.8"/>
            <line x1="21" y1="20" x2="21" y2="21" stroke-width="1.8"/>
            <line x1="14" y1="21" x2="19" y2="21" stroke-width="1.8"/>
          </svg>
        </div>
      </div>
      <!-- Avatar row -->
      <div class="avatar-row">
        <div class="row-icon">
          <!-- Avatar/face icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="20" height="20"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/><circle cx="7" cy="6" r="1.5" fill="#5b6bc0" stroke="none" opacity="0.5"/></svg>
        </div>
        <span class="row-label">Avatar</span>
        <div class="row-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="2.2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
    </div>

    <!-- SECTION 2: List / Broadcast / Starred / Linked -->
    <div class="section">
      <div class="setting-row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="20" height="20"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="17" x2="13" y2="17"/></svg>
        </div>
        <span class="setting-label">List</span>
        <div class="row-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="2.2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="setting-row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="20" height="20"><path d="M3 5h18M3 12h18M3 19h12"/><polygon points="19 14 22 17 19 20" fill="#5b6bc0" stroke="none"/></svg>
        </div>
        <span class="setting-label">Broadcast messages</span>
        <div class="row-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="2.2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="setting-row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="20" height="20"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <span class="setting-label">Starred messages</span>
        <div class="row-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="2.2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="setting-row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="20" height="20"><rect x="2" y="6" width="14" height="10" rx="2"/><path d="M16 10l4-3v10l-4-3"/></svg>
        </div>
        <span class="setting-label">Linked devices</span>
        <div class="row-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="2.2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
    </div>

    <!-- SECTION 3: Account / Privacy / Chats / Notifications / Storage -->
    <div class="section">
      <div class="setting-row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="20" height="20"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        </div>
        <span class="setting-label">Account</span>
        <div class="row-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="2.2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="setting-row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="20" height="20"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        </div>
        <span class="setting-label">Privacy</span>
        <div class="row-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="2.2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="setting-row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="20" height="20"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </div>
        <span class="setting-label">Chats</span>
        <div class="row-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="2.2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="setting-row">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="20" height="20"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        </div>
        <span class="setting-label">Notifications</span>
        <div class="row-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="2.2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <!-- Storage and data – partiellement visible -->
      <div class="setting-row" style="overflow:hidden;height:50px">
        <div class="row-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="1.8" width="20" height="20"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></svg>
        </div>
        <span class="setting-label">Storage and data</span>
        <div class="row-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="#5b6bc0" stroke-width="2.2" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
    </div>

  </div>

  <!-- TAB BAR -->
  <div class="tab-bar">
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" width="26" height="26"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="tab-label">Updates</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" width="26" height="26"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 8.63 19.79 19.79 0 01.02 4a2 2 0 012-2.18h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
      <span class="tab-label">Calls</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" width="26" height="26"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      <span class="tab-label">Communities</span>
    </div>
    <div class="tab-item">
      <div style="position:relative;display:inline-block">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" width="26" height="26"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        <div style="position:absolute;top:-4px;right:-8px;background:#FF3B30;color:#fff;font-size:10px;font-weight:600;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px">1</div>
      </div>
      <span class="tab-label">Chats</span>
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="#25D366" stroke-width="2" width="26" height="26"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
      <span class="tab-label active">Settings</span>
    </div>
  </div>

</div>
</body>
</html>
