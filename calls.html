<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Calls</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{background:#f0f0f0;display:flex;justify-content:center;padding:40px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif}
.screen{width:390px;background:#fff;border-radius:40px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.2)}

/* STATUS BAR */
.status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:14px 20px 0;background:#fff}
.status-time{font-size:15px;font-weight:600;color:#000}
.status-icons{display:flex;align-items:center;gap:6px}

/* HEADER */
.page-header{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 16px 0}
.header-left{display:flex;flex-direction:column;gap:0}
.menu-icon{width:36px;height:36px;border-radius:9px;background:#eef0f8;display:flex;align-items:center;justify-content:center}
.page-title{font-size:34px;font-weight:700;color:#000;letter-spacing:0.3px;margin-top:6px}
.add-btn{width:36px;height:36px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;margin-top:4px}

/* CONTENT */
.content{padding:0 16px}

/* SECTION TITLE */
.section-title{font-size:20px;font-weight:700;color:#000;margin:22px 0 12px}

/* FAVOURITES */
.add-fav-row{display:flex;align-items:center;gap:14px;padding:6px 0 10px}
.add-fav-icon{width:46px;height:46px;border-radius:50%;background:#eef0f8;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add-fav-label{font-size:16px;color:#000}

/* RECENT ROWS */
.call-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid #e5e5ea}
.call-row:last-child{border-bottom:none}
.call-avatar{width:48px;height:48px;border-radius:50%;overflow:hidden;flex-shrink:0}
.call-avatar img{width:100%;height:100%;object-fit:cover}
.call-info{flex:1;min-width:0}
.call-name{font-size:16px;font-weight:500;color:#000;display:flex;align-items:center;gap:4px}
.call-name.missed{color:#e53935}
.call-type{display:flex;align-items:center;gap:5px;font-size:13px;color:#8e8e93;margin-top:2px}
.call-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.call-time{font-size:14px;color:#8e8e93}
.info-btn{width:32px;height:32px;border-radius:8px;background:#eef0f8;display:flex;align-items:center;justify-content:center}

/* FOOTER */
.footer-note{text-align:center;font-size:13px;color:#8e8e93;padding:24px 20px 16px;display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap}
.footer-note a{color:#25D366;text-decoration:none}

/* TAB BAR */
.tab-bar{background:#f2f2f7;border-top:0.5px solid #c7c7cc;display:flex;padding:0 0 20px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 0;cursor:pointer}
.tab-label{font-size:10px;color:#8e8e93}
.tab-label.active{color:#25D366;font-weight:600}
</style>
</head>
